name: hyprws rebase report

# Mirrors upstream/main onto the fork's main and uploads a fresh rebase
# orientation for the fork-sync skill's gate 1. The report embeds the
# origin/hyprws head, so it is never committed; every hyprws push and the
# schedule refresh both, and gate 1 regenerates the report live when a rebase
# actually starts.

on:
  push:
    branches:
      - hyprws
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyprws-rebase-report
  cancel-in-progress: true

jobs:
  # Upstream commits touch .github/workflows, which GITHUB_TOKEN may never push,
  # so this job authenticates with HYPRWS_MIRROR_TOKEN: a fine-grained PAT for
  # this repository with Contents and Workflows read/write.
  mirror:
    name: Mirror main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.HYPRWS_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::HYPRWS_MIRROR_TOKEN secret is missing; see docs/operations/fork-sync.md"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.HYPRWS_MIRROR_TOKEN }}

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      # Nothing else ever writes main, so a rejected push means someone did;
      # the job fails instead of forcing (docs/operations/fork-sync.md).
      - name: Fast-forward main
        run: |
          git fetch --tags upstream main
          git push origin upstream/main:refs/heads/main
          git push origin --tags

  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Generate report
        run: node scripts/fork-rebase-report.ts --fetch

      - name: Summarize
        run: cat docs/internals/generated/fork-rebase-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: fork-rebase-report
          path: |
            docs/internals/generated/fork-rebase-report.json
            docs/internals/generated/fork-rebase-report.md
          if-no-files-found: error
          retention-days: 7
