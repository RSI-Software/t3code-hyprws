name: hyprws Body

# Pull request body validation stays separate from the required source checks so
# an edit cannot replace their conclusions or cancel an in-flight full CI run.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - hyprws
      - "release/**"

concurrency:
  group: hyprws-body-${{ github.event.pull_request.number }}
  # Body runs take about a minute, so never leave a permanent cancelled
  # conclusion on the pull request head just to stop one early.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  body:
    name: Body
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # A live `pingdotgg/t3code#N` or item URL in a fork body posts a backlink
      # on the upstream thread, and a bare `#N` the fork never issued resolves
      # there, so a citation must sit in a code span or a fence and a fork item
      # must name this fork in full (docs/internals/fork-development.md). The
      # guard reports every bare number, because it cannot tell those apart
      # offline. This is a backstop, not the gate:
      # the body is already published by the time the run starts, so it reports
      # a backlink that has fired rather than preventing one. `vp run
      # fork:upstream-refs` against the body file before publishing is the gate,
      # and it is the only thing that covers an issue or a comment. Fetch the
      # current body once for both checks. Citations run before the squash-body
      # ledger so a failure there cannot hide this one; see
      # docs/internals/scripts.md for what stays unguarded.
      - name: Upstream citations
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${NUMBER}" --jq '.body // ""' > "$RUNNER_TEMP/pull-request-body.md"
          vp run fork:upstream-refs "$RUNNER_TEMP/pull-request-body.md"

      # The squash commit takes the pull-request body as its message, so check
      # the current body fetched above for its trailer block. Both edited-trigger
      # runs and failed-job reruns use the live body. Draft and non-hyprws pull
      # requests are rehearsal surfaces that do not land by squash merge.
      - name: Fork ledger (squash body)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'hyprws' &&
          github.event.pull_request.draft == false
        run: |
          vp run fork:delta --check --squash-body "$RUNNER_TEMP/pull-request-body.md"
