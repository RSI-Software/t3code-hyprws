name: hyprws sync resolution

# A marker pushed to sync/resolution reruns the upstream sync from the trunk's
# own definition (docs/fork/operations/fork-sync.md#the-land-run). A push runs
# the workflow files of the pushed commit; a marker's tree is its lease's, a
# trunk tree, so this file is always one the trunk carried. The job holds no
# secret and only dispatches on hyprws, the one ref the hyprws-sync
# environment deploys to; the dispatched run queues behind any sync in flight.
#
# A job that ends without a push (failed, blocked, unchanged) leaves only its
# sticky comment, so a settled rsi-pr-agent sticky also reruns the sync. An
# issue_comment runs the default branch's file, which is hyprws.

on:
  push:
    branches:
      - sync/resolution
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  rerun:
    name: Rerun the upstream sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'push' || (
        github.event.comment.user.login == 'rsi-pr-agent[bot]' &&
        contains(github.event.comment.body, '<!-- rsi:fork-sync -->') &&
        !contains(github.event.comment.body, '**running**') &&
        !contains(github.event.comment.body, '**pushing**'))
    permissions:
      actions: write
    steps:
      - name: Dispatch the trunk's sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hyprws-upstream-sync.yml --ref hyprws --repo "$GITHUB_REPOSITORY"
