name: hyprws CI

# Fork-only CI for RSI-Software/t3code-hyprws. Upstream's ci.yml targets
# Blacksmith runners the fork does not have, so it stays disabled on the fork
# (docs/fork/operations/fork-sync.md). Jobs run on GitHub-hosted runners, which are
# free for a public repository. Mirror upstream ci.yml step changes here on
# every rebase (docs/fork/internals/fork-delta.md, distribution).

on:
  # No `ready_for_review`: GitHub already runs `pull_request` on a draft, so the
  # matrix has normally passed on this exact head before the draft is marked
  # ready, and listing the event only discards those results and reruns them.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - hyprws
      - "release/**"
  # A merge queue builds `gh-readonly-queue/<base>/**` and waits for the
  # contexts the branch ruleset requires. Every one of them comes from this
  # workflow, so without this trigger a queued entry reports nothing and sits
  # until it times out.
  merge_group:
  push:
    branches:
      - hyprws
      - "release/**"

concurrency:
  group: hyprws-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The ledger compares against upstream, which the fork checkout does not
      # carry. On a pull request, inspect the branch head rather than the
      # synthetic merge commit, which has no trailers. The flag derivation is
      # not restated here: scripts/lib/fork-ci-flags.ts owns it, and
      # `vp run fork:ci` calls the same helper locally; this step only
      # provisions the remotes the derivation reads.
      - name: Fork ledger
        id: fork_ledger
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          vp run fork:delta --check --head "$HEAD_SHA"
          node scripts/lib/fork-ci-flags.ts ledger --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Pin to the fork's own base: the rebase-scan table check judges this
      # head against the upstream base it sits on, not live upstream/main.
      # The argv comes from the shared helper; this step only replays it.
      - name: Fork rebase scan
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t SCAN_ARGS < <(node scripts/lib/fork-ci-flags.ts scan --head "$HEAD_SHA")
          if [ "${#SCAN_ARGS[@]}" -eq 0 ]; then
            echo "flag derivation produced no argv" >&2
            exit 1
          fi
          vp run fork:scan "${SCAN_ARGS[@]}"

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  # Merge-tree conflict gate: is this head harder to rebase than the
  # trunk? `git merge-tree --write-tree upstream/main <ref>` lists every
  # path whose merge back into live upstream/main conflicts. Running it
  # for the PR head and for origin/hyprws separates conflicts the branch
  # introduces (head-only paths red the job and land in the step summary)
  # from conflicts the trunk already carries (base-inherited paths stay
  # silent). Replaces the old advisory rebase scan, which blamed the
  # branch for upstream landing on a shared file.
  merge-tree:
    name: merge-tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Merge-tree conflict check
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git 2>/dev/null || true
          git fetch --no-tags upstream main
          git fetch --no-tags origin hyprws
          set +e
          git merge-tree --write-tree --name-only --no-messages upstream/main "$HEAD_SHA" > "$RUNNER_TEMP/head-conflicts.txt"
          head_code=$?
          git merge-tree --write-tree --name-only --no-messages upstream/main origin/hyprws > "$RUNNER_TEMP/base-conflicts.txt"
          base_code=$?
          set -e
          # 0 is clean, 1 is conflicts; anything else is a broken
          # invocation that must fail loudly rather than pass silent.
          if [ "$head_code" -ne 0 ] && [ "$head_code" -ne 1 ]; then
            echo "merge-tree for head failed (exit $head_code)" >&2
            exit "$head_code"
          fi
          if [ "$base_code" -ne 0 ] && [ "$base_code" -ne 1 ]; then
            echo "merge-tree for origin/hyprws failed (exit $base_code)" >&2
            exit "$base_code"
          fi
          tail -n +2 "$RUNNER_TEMP/head-conflicts.txt" | sort -u > "$RUNNER_TEMP/head-paths.txt"
          tail -n +2 "$RUNNER_TEMP/base-conflicts.txt" | sort -u > "$RUNNER_TEMP/base-paths.txt"
          comm -23 "$RUNNER_TEMP/head-paths.txt" "$RUNNER_TEMP/base-paths.txt" > "$RUNNER_TEMP/head-only.txt"
          if [ -s "$RUNNER_TEMP/head-only.txt" ]; then
            {
              printf '## Merge-tree conflicts introduced by this head\n\n'
              printf 'These paths conflict against `upstream/main` for this head but not for `origin/hyprws`:\n\n```\n'
              cat "$RUNNER_TEMP/head-only.txt"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "head-only merge-tree conflicts:" >&2
            cat "$RUNNER_TEMP/head-only.txt" >&2
            exit 1
          fi
          echo "merge-tree clean: no head-only conflicts"

  # Everything except `t3` (apps/server), `web`, and the fork's own
  # scripts suite; see upstream ci.yml for why `--parallel` is safe here.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/web' --filter '!@t3tools/scripts' --filter '!@t3tools/monorepo' test

  # `web` runs alone: its editable-file highlighting tests sit close to
  # upstream's 15 s per-test budget on a GitHub-hosted runner, and time
  # out whenever the pooled job is under load (fork issue 1053). Upstream
  # tunes that budget for Blacksmith, so the fork widens it here rather
  # than in the shared vite config.
  test_web:
    name: Test Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter @t3tools/web test --testTimeout=60000

  # The fork's scripts suite is large and does not shrink with the
  # product; a dedicated job keeps it from holding a pooled slot while
  # `web` queues behind it.
  test_scripts:
    name: Test Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Test
        run: vp run --filter @t3tools/scripts test

  # apps/server runs its files one at a time; sharding spreads them over
  # runners instead of workers, exactly as upstream does.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
