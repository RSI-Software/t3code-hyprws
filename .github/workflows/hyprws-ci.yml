name: hyprws CI

# Fork-only CI for RSI-Software/t3code-hyprws. Upstream's ci.yml targets
# Blacksmith runners the fork does not have, so it stays disabled on the fork
# (docs/operations/fork-sync.md). Jobs run on GitHub-hosted runners, which are
# free for a public repository. Mirror upstream ci.yml step changes here on
# every rebase (docs/internals/fork-delta.md, distribution).

on:
  # No `ready_for_review`: GitHub already runs `pull_request` on a draft, so the
  # matrix has normally passed on this exact head before the draft is marked
  # ready, and listing the event only discards those results and reruns them.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - hyprws
      - "release/**"
  # A merge queue builds `gh-readonly-queue/<base>/**` and waits for the
  # contexts the branch ruleset requires. Every one of them comes from this
  # workflow, so without this trigger a queued entry reports nothing and sits
  # until it times out.
  merge_group:
  push:
    branches:
      - hyprws
      - hyprws-next
      - "release/**"

concurrency:
  group: hyprws-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # The ledger compares against upstream, which the fork checkout does not
      # carry. On a pull request, inspect the branch head rather than the
      # synthetic merge commit, which has no trailers.
      - name: Fork ledger
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
          vp run fork:delta --check --head "$HEAD_SHA"

      # A rebase scan is what the next sync reads before trusting an automerge,
      # so a domain that changes a file upstream is changing too has to name it
      # (docs/internals/fork-delta.md). Reuses the upstream remote the ledger
      # step added. Advisory, not blocking: the only window with signal here is
      # live upstream/main, and upstream landing a commit on a shared file is
      # not the fault of the pull request under test. The blocking run is gates 3
      # and 4 of the fork-sync skill, which scan against the new target tag while
      # the fork still sits on the old one.
      - name: Fork rebase scans (advisory)
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: vp run fork:scan --head "$HEAD_SHA" --no-typecheck

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  # Everything except `t3` (apps/server); see upstream ci.yml for why
  # `--parallel` is safe here.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' test

  # apps/server runs its files one at a time; sharding spreads them over
  # runners instead of workers, exactly as upstream does.
  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}
