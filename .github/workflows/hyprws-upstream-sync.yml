name: hyprws upstream sync

# The land run: `fork:sync --land` takes a finished sync/resolution marker, or
# rebases itself when there is none, proves the tip on candidate CI, and
# lease-pushes the trunk. `fork:sync` is the whole state machine; this workflow
# only gives it credentials and a checkout. A clean run closes the stale sync
# issues, block and failure alike. A blocked or failed run files its issue
# inside the driver before it exits non-zero, so no `if: failure()` step exists
# here.
#
# Each job pushes with an hour-long rsi-software-agent app token for this
# repository: upstream commits touch .github/workflows, which GITHUB_TOKEN may
# never push, and a GITHUB_TOKEN push starts no hyprws CI on the candidate. The
# token reaches Git only through GIT_CONFIG_*, exported around the driver step:
# the worktree setup and regenerators run rebased code, and the driver scrubs
# those keys from everything it spawns there. The same token checks out the
# trunk; the scrub step below removes it before any rebased code can run. The
# app key lives in the hyprws-sync environment, which deploys only to hyprws: a
# run started from any other ref never sees it.
#
# rsi-agent's workflow heartbeat dispatches this every 15 min; GitHub drops
# most `schedule` runs, so there is none. A run's outcome follows from the
# upstream tags, `hyprws`, `sync/resolution`, and the clock behind the agent
# retry and the marker pin, so the same inputs reach the driver once per UTC
# hour: a repeat skips Sync and the stable cut. `rerun` never skips; the
# resolution workflow's dispatch sets it (docs/fork/operations/fork-sync.md).

on:
  push:
    branches:
      - hyprws
  workflow_dispatch:
    inputs:
      rerun:
        description: Run even when the inputs match a run this hour
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hyprws-sync
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror main
    environment: hyprws-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.inputs.outputs.key }}
      repeat: ${{ steps.repeat.outputs.cache-hit }}
    steps:
      - name: Mint push token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: Iv23liKrLhGco8XykVzC # rsi-software-agent
          private-key: ${{ secrets.HYPRWS_SYNC_APP_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      # Nothing else ever writes main, so a rejected push means someone did;
      # the job fails instead of forcing (docs/fork/operations/fork-sync.md).
      # Tags are forced: upstream re-points moving tags such as android-nightly,
      # and fork tags never share a name with an upstream one.
      - name: Fast-forward main
        run: |
          git fetch --tags --force upstream main
          git push origin upstream/main:refs/heads/main
          git push origin --tags --force

      - name: Key the sync inputs
        id: inputs
        run: |
          inputs="$(git ls-remote --tags upstream && git ls-remote origin refs/heads/hyprws refs/heads/sync/resolution)"
          echo "key=hyprws-sync-$(sha256sum <<<"$inputs" | cut -c1-16)-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      # The path is the Sync job's driver log; it saves the key once the driver ran.
      - name: Look up a run this hour
        id: repeat
        if: ${{ !inputs.rerun }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-sync.log
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true

      - name: Skip a repeat
        if: steps.repeat.outputs.cache-hit == 'true'
        run: echo "Inputs match a run this hour (\`${{ steps.inputs.outputs.key }}\`); Sync skips. Rerun with \`-f rerun=true\`." >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: Sync
    needs: [mirror]
    if: needs.mirror.outputs.repeat != 'true'
    environment: hyprws-sync
    runs-on: ubuntu-latest
    # The driver waits up to an hour on hyprws CI for the candidate.
    timeout-minutes: 90
    permissions:
      # gh run list/view: the candidate's hyprws CI run
      actions: read
      contents: read
      issues: write
    steps:
      # Actions write is for the flake rerun.
      - name: Mint push token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: Iv23liKrLhGco8XykVzC # rsi-software-agent
          private-key: ${{ secrets.HYPRWS_SYNC_APP_KEY }}
          permission-actions: write
          permission-contents: write
          permission-workflows: write

      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # checkout v6 stores its extraheader in a RUNNER_TEMP config reached through
      # local includeIf entries, and its credential teardown walks submodules via
      # `git submodule foreach --recursive`, which hard-fails on the vendor
      # gitlinks that .gitmodules does not list (RSI-Software/t3code-hyprws#871).
      # So persist-credentials stays at its default and the leftover token is
      # scrubbed here instead. This must run before Setup Vite+: its
      # run-install executes rebased code that must never see the token.
      - name: Scrub persisted credentials
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            value="$(git config --local --get "$key")"
            case "$value" in
              *git-credentials-*.config)
                git config --local --unset-all "$key"
                ;;
            esac
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          rm -f "$RUNNER_TEMP"/git-credentials-*.config
          if git config --get-all http.https://github.com/.extraheader | grep -q .; then
            echo "::error::http.https://github.com/.extraheader still present after scrub"
            exit 1
          fi
          if git config --local --get-regexp '^includeIf\.' | grep -q .; then
            echo "::error::includeIf config entries still present after scrub"
            exit 1
          fi
          if ls "$RUNNER_TEMP"/git-credentials-*.config >/dev/null 2>&1; then
            echo "::error::git-credentials file still present after scrub"
            exit 1
          fi

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Configure Git identity and rerere
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoupdate false

      # The driver pushes the candidate and the trunk with the app token, built
      # here so the token never lands in .git/config or a workflow env block
      # rebased code inherits. Its CI reads and issue writes go through gh with
      # the job's own token and name the repository themselves; a flake rerun
      # goes through the app token.
      - name: Run the sync driver
        id: driver
        env:
          GH_TOKEN: ${{ github.token }}
          HYPRWS_PUSH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HYPRWS_PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          set +e
          vp run fork:sync --land 2>&1 | tee "$RUNNER_TEMP/fork-sync.log"
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Summarize the run
        if: always()
        run: |
          log="$RUNNER_TEMP/fork-sync.log"
          {
            printf '## hyprws upstream sync\n\n'
            if [ -f "$log" ]; then
              printf '```\n'
              cat "$log"
              printf '```\n'
            else
              printf 'The sync driver never ran; see the earlier steps.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Any outcome counts: a red run already posted its issue, and the next
      # hour retries. A run that never reached the driver saves nothing.
      - name: Save the sync inputs
        if: ${{ !cancelled() && steps.driver.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-sync.log
          key: ${{ needs.mirror.outputs.key }}

  # The cut reads only tags, so a skipped repeat has nothing new for it.
  stable:
    name: Stable
    needs: [sync]
    if: ${{ !cancelled() && needs.sync.result != 'skipped' }}
    permissions:
      actions: write
      contents: read
      issues: write
    uses: ./.github/workflows/hyprws-stable.yml
