name: hyprws upstream sync

# Mirrors upstream/main onto the fork's main, uploads the fork-sync orientation,
# then rebases the fork stack onto the newest upstream tag inside the clean
# feasibility window. HYPRWS_AUTO_REBASE selects off, candidate, or on and gates
# only the rebase push; reporting and tickets always run. An unset variable uses
# candidate mode. Auto-rebase drops the checkout token before it runs rebased
# code; the mirror PAT reaches only the push helper.

on:
  push:
    branches:
      - hyprws
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyprws-rebase
  cancel-in-progress: false

jobs:
  # Upstream commits touch .github/workflows, which GITHUB_TOKEN may never push,
  # so this job authenticates with HYPRWS_MIRROR_TOKEN: a fine-grained PAT for
  # this repository with Contents and Workflows read/write.
  mirror:
    name: Mirror main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.HYPRWS_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::HYPRWS_MIRROR_TOKEN secret is missing; see docs/operations/fork-sync.md"
            exit 1
          fi

      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0
          token: ${{ secrets.HYPRWS_MIRROR_TOKEN }}

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      # Nothing else ever writes main, so a rejected push means someone did;
      # the job fails instead of forcing (docs/operations/fork-sync.md).
      - name: Fast-forward main
        run: |
          git fetch --tags upstream main
          git push origin upstream/main:refs/heads/main
          git push origin --tags

  generate:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Generate report
        run: node scripts/fork-rebase-report.ts --fetch

      - name: Summarize
        run: cat docs/internals/generated/fork-rebase-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: fork-rebase-report
          path: |
            docs/internals/generated/fork-rebase-report.json
            docs/internals/generated/fork-rebase-report.md
          if-no-files-found: error
          retention-days: 7

  rebase:
    name: Auto-rebase
    needs: [mirror, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0

      # checkout v6 stores its extraheader in a RUNNER_TEMP config reached through
      # local includeIf entries. Remove both before any rebased code can run.
      - name: Remove checkout credential
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          while read -r key credential_config; do
            case "$credential_config" in
              "$RUNNER_TEMP"/git-credentials-*.config)
                git config --local --unset-all "$key"
                rm -f -- "$credential_config"
                ;;
              /github/runner_temp/git-credentials-*.config)
                git config --local --unset-all "$key"
                ;;
            esac
          done < <(git config --local --get-regexp '^includeIf\.gitdir:' || true)

          test -z "$(git config --show-origin --get-all http.https://github.com/.extraheader || true)"
          test -z "$(git config --local --get-regexp '^includeIf\.gitdir:' | grep 'git-credentials-.*\.config' || true)"
          ! compgen -G "$RUNNER_TEMP/git-credentials-*.config" > /dev/null

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase fork stack
        id: rebase
        env:
          HYPRWS_PUSH_TOKEN: ${{ secrets.HYPRWS_MIRROR_TOKEN }}
          REBASE_MODE: ${{ vars.HYPRWS_AUTO_REBASE || 'candidate' }}
        run: |
          set +e
          vp run fork:auto-rebase --fetch --mode "$REBASE_MODE" --github-output \
            --summary "$RUNNER_TEMP/fork-auto-rebase.md" \
            --issue-json "$RUNNER_TEMP/fork-auto-rebase-issues.json" \
            2> >(tee "$RUNNER_TEMP/fork-auto-rebase-error.log" >&2)
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "status=hard-failure" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      - name: Summarize auto-rebase
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fork-auto-rebase.md" ]; then
            cat "$RUNNER_TEMP/fork-auto-rebase.md" >> "$GITHUB_STEP_SUMMARY"
          else
            failure=$(tail -n 1 "$RUNNER_TEMP/fork-auto-rebase-error.log" 2>/dev/null || echo "unknown failure")
            printf 'Auto-rebase failed: `%s`. See the Rebase fork stack step.\n' "$failure" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Reconcile blocked issue
        if: ${{ always() && (steps.rebase.outputs.status == 'blocked' || steps.rebase.outputs.status == 'clear' || steps.rebase.outputs.status == 'stable-candidate') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_JSON: ${{ runner.temp }}/fork-auto-rebase-issues.json
        run: node scripts/fork-rebase-notify.ts --input "$ISSUE_JSON"

      - name: Open stable candidate issues
        if: ${{ always() && (steps.rebase.outputs.status == 'stable-candidate' || steps.rebase.outputs.stable_status == 'stable-candidate') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_JSON: ${{ runner.temp }}/fork-auto-rebase-issues.json
        run: |
          jq -c '.stableCandidates[]' "$ISSUE_JSON" | while read -r candidate; do
            title=$(jq -r '.title' <<< "$candidate")
            marker=$(jq -r '.marker' <<< "$candidate")
            matches=$(gh issue list --label release --state all --limit 1000 --json number,body)
            if [ -n "$(jq -r --arg marker "$marker" '.[] | select(.body | contains($marker)) | .number' <<< "$matches" | head -1)" ]; then
              continue
            fi
            jq -r '.body' <<< "$candidate" > "$RUNNER_TEMP/stable-candidate.md"
            gh issue create --title "$title" --label release \
              --body-file "$RUNNER_TEMP/stable-candidate.md"
          done
