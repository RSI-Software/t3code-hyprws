name: hyprws upstream sync

# One driver runs one upstream release tag end to end: fetch, rebase, check,
# push, blocked-issue and failure-issue publication, report. `fork:sync` is the
# whole state machine; this workflow only gives it credentials and a checkout.
# The push goes out under the documented expected-old lease, and a clean run
# closes the stale sync issues — block and failure alike — it made stale. A
# failed run files its issue inside the driver before it exits non-zero, so no
# `if: failure()` step exists here.
#
# The sync job's own push (the trunk) needs the
# mirror PAT, because upstream commits touch .github/workflows, which
# GITHUB_TOKEN may never push. The PAT reaches Git only through GIT_CONFIG_*,
# exported around the driver step: check commands run rebased code, and the
# driver scrubs those keys from everything it spawns there. The same PAT
# checks out the trunk; the scrub step below removes it before any rebased
# code can run.

on:
  push:
    branches:
      - hyprws
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyprws-sync
  cancel-in-progress: false

jobs:
  # Upstream commits touch .github/workflows, so this job authenticates with
  # HYPRWS_MIRROR_TOKEN: a fine-grained PAT for this repository with Contents
  # and Workflows read/write.
  mirror:
    name: Mirror main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.HYPRWS_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::HYPRWS_MIRROR_TOKEN secret is missing; see docs/fork/operations/fork-sync.md"
            exit 1
          fi

      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0
          token: ${{ secrets.HYPRWS_MIRROR_TOKEN }}

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      # Nothing else ever writes main, so a rejected push means someone did;
      # the job fails instead of forcing (docs/fork/operations/fork-sync.md).
      - name: Fast-forward main
        run: |
          git fetch --tags upstream main
          git push origin upstream/main:refs/heads/main
          git push origin --tags

  sync:
    name: Sync
    needs: [mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout fork trunk
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0
          token: ${{ secrets.HYPRWS_MIRROR_TOKEN }}

      # checkout v6 stores its extraheader in a RUNNER_TEMP config reached through
      # local includeIf entries, and its credential teardown walks submodules via
      # `git submodule foreach --recursive`, which hard-fails on the vendor
      # gitlinks that .gitmodules does not list (RSI-Software/t3code-hyprws#871).
      # So persist-credentials stays at its default and the leftover token is
      # scrubbed here instead. This must run before Setup Vite+: its
      # run-install executes rebased code that must never see the token.
      - name: Scrub persisted credentials
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            value="$(git config --local --get "$key")"
            case "$value" in
              *git-credentials-*.config)
                git config --local --unset-all "$key"
                ;;
            esac
          done < <(git config --local --name-only --get-regexp '^includeIf\.gitdir:')
          rm -f "$RUNNER_TEMP"/git-credentials-*.config
          if git config --get-all http.https://github.com/.extraheader | grep -q .; then
            echo "::error::http.https://github.com/.extraheader still present after scrub"
            exit 1
          fi
          if git config --local --get-regexp '^includeIf\.' | grep -q .; then
            echo "::error::includeIf config entries still present after scrub"
            exit 1
          fi
          if ls "$RUNNER_TEMP"/git-credentials-*.config >/dev/null 2>&1; then
            echo "::error::git-credentials file still present after scrub"
            exit 1
          fi

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Add upstream
        run: git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Configure Git identity and rerere
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoupdate false

      # The driver pushes the trunk with the mirror
      # PAT, built here so the token never lands in .git/config or a workflow
      # env block the check battery inherits. Its issue writes go through ghb
      # with the job's own token (issues: write).
      - name: Run the sync driver
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HYPRWS_PUSH_TOKEN: ${{ secrets.HYPRWS_MIRROR_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HYPRWS_PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          set +e
          vp run fork:sync 2>&1 | tee "$RUNNER_TEMP/fork-sync.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Summarize the run
        if: always()
        run: |
          {
            printf '## hyprws upstream sync\n\n'
            if [ -f "$RUNNER_TEMP/fork-sync.log" ]; then
              printf '```\n'
              cat "$RUNNER_TEMP/fork-sync.log"
              printf '```\n'
            else
              printf 'The sync driver never ran; see the earlier steps.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
