name: hyprws Release

# Fork-only Linux x64 release channels for RSI-Software/t3code-hyprws.
# Stable tags keep the v<upstream>-hyprws.<n> flow. Trunk landings publish their
# pushed commit. Scheduled fallbacks and nightly manual dispatches publish
# v<next>-hyprws-nightly.<date>.<run> from hyprws.
# Upstream release.yml stays disabled on the fork; mirror its job shape, setup,
# and action versions here on every rebase (docs/internals/fork-delta.md).

on:
  push:
    branches:
      - hyprws
    tags:
      - "v*-hyprws.*"
      - "!v*-hyprws-nightly.*"
  schedule:
    # Off minute zero: GitHub delays scheduled runs most at the top of the hour.
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Fork release channel"
        required: false
        default: nightly
        type: choice
        options:
          - nightly
          - stable

# Stable tag pushes and stable dispatches use the stable queue; every other run uses nightly.
# Preflight remains the only place that resolves the requested channel.
concurrency:
  group: hyprws-release-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.channel == 'stable') && 'stable' || 'nightly' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  check_changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout hyprws
        uses: actions/checkout@v6
        with:
          ref: hyprws
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: check
        name: Compare hyprws to last nightly tag
        shell: bash
        run: |
          last_nightly_tag=$(git tag --list 'v*-hyprws-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "No previous hyprws nightly tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$last_nightly_tag" HEAD; then
            echo "$last_nightly_tag is not on the current hyprws history. Proceeding after trunk rewrite."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_nightly_sha=$(git rev-parse "$last_nightly_tag^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [[ "$last_nightly_sha" == "$head_sha" ]]; then
            echo "No changes on hyprws since $last_nightly_tag. Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected on hyprws since $last_nightly_tag ($last_nightly_sha → $head_sha). Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_channel: ${{ steps.release_channel.outputs.channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      upstream_base: ${{ steps.upstream_base.outputs.tag }}
      ref: ${{ steps.release_ref.outputs.sha }}
    steps:
      - id: release_channel
        name: Resolve and validate release channel
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule)
              channel=nightly
              ;;
            workflow_dispatch)
              channel="${DISPATCH_CHANNEL:-nightly}"
              ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                channel=stable
              else
                channel=nightly
              fi
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$channel" != "nightly" && "$channel" != "stable" ]]; then
            echo "Invalid fork release channel: $channel" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$channel" == "stable" && ( "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hyprws\.[0-9]+$ ) ]]; then
            echo "workflow_dispatch channel=stable must run from a vX.Y.Z-hyprws.N tag ref." >&2
            exit 1
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'push' || steps.release_channel.outputs.channel == 'stable') && github.sha || 'hyprws' }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: release_ref
        name: Resolve release commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.channel }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_SHA: ${{ steps.release_ref.outputs.sha }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "nightly" ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"
            node scripts/fork-release-version.ts \
              --channel "$RELEASE_CHANNEL" \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$RELEASE_SHA" \
              --github-output
          else
            node scripts/fork-release-version.ts \
              --channel "$RELEASE_CHANNEL" \
              --tag "$GITHUB_REF_NAME" \
              --github-output
          fi

      - id: previous_tag
        name: Keep previous release tag on current history
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.release_meta.outputs.previous_tag }}
        run: |
          previous_tag="$PREVIOUS_TAG"
          if [[ -n "$previous_tag" ]] && ! git merge-base --is-ancestor "$previous_tag" HEAD; then
            echo "$previous_tag is not on the current history. Omitting it after trunk rewrite."
            previous_tag=
          fi
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Fork ledger
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --tags upstream main
          vp run fork:delta --check

      - id: upstream_base
        name: Resolve upstream base
        run: |
          base_commit="$(git merge-base HEAD upstream/main)"
          tags="$(git tag --points-at "$base_commit" --sort=-v:refname)"
          base="$(printf '%s\n' "$tags" | grep -v -- '-nightly\.' | head -n 1 || true)"
          if [[ -z "$base" ]]; then
            base="$(printf '%s\n' "$tags" | head -n 1)"
          fi
          if [[ -z "$base" ]]; then
            base="$(git describe --tags --abbrev=0 "$base_commit")"
          fi
          echo "tag=$base" >> "$GITHUB_OUTPUT"
          echo "upstream base: $base"

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

  build:
    name: Build Linux x64
    needs: preflight
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.AppImage release/*.yml; do
            cp "$file" release-publish/
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          body: |
            Upstream base: `${{ needs.preflight.outputs.upstream_base }}`
            Channel: `${{ needs.preflight.outputs.release_channel }}`
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.AppImage
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          body: |
            Upstream base: `${{ needs.preflight.outputs.upstream_base }}`
            Channel: `${{ needs.preflight.outputs.release_channel }}`
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.AppImage
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Prune old nightlies
        if: needs.preflight.outputs.release_channel == 'nightly'
        continue-on-error: false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ needs.preflight.outputs.tag }}
          NIGHTLY_KEEP: 7
        run: |
          set -euo pipefail

          releases="$(gh release list \
            --limit 1000 \
            --json tagName,isPrerelease,isDraft,publishedAt)"
          stale_tags="$(
            jq -r \
              --arg current "$CURRENT_TAG" \
              --argjson keep "$NIGHTLY_KEEP" \
              '
                map(select(
                  .isPrerelease == true and
                  .isDraft == false and
                  (.tagName | test("^.*-hyprws-nightly\\..*$"))
                ))
                | sort_by(.publishedAt)
                | reverse
                | .[$keep:]
                | .[]
                | select(.tagName != $current)
                | .tagName
              ' <<< "$releases"
          )"

          if [[ -z "$stale_tags" ]]; then
            echo "No old nightly releases to prune."
            exit 0
          fi

          while IFS= read -r tag; do
            echo "Deleting old nightly release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$stale_tags"
