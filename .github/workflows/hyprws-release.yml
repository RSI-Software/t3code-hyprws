name: hyprws Release

# Fork-only release for RSI-Software/t3code-hyprws: one Linux x64 AppImage per
# v<upstream>-hyprws.<n> tag, published as a normal GitHub release so the
# desktop updater (fed from GITHUB_REPOSITORY) picks it up. Upstream's
# release.yml stays disabled on the fork; its Linux build entry is the
# template for the build job below, so re-read it on every rebase
# (docs/internals/fork-delta.md, distribution). No nightly channel, no cron.

on:
  push:
    tags:
      - "v*-hyprws.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Fork release version (for example 0.0.34-hyprws.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      upstream_base: ${{ steps.upstream_base.outputs.tag }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${DISPATCH_VERSION}"
          else
            raw="${GITHUB_REF_NAME}"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-hyprws\.[0-9]+$ ]]; then
            echo "Invalid fork release version: $raw (expected X.Y.Z-hyprws.N)" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=T3 Code hyprws v$version" >> "$GITHUB_OUTPUT"

      - name: Fork ledger
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --tags upstream main
          vp run fork:delta --check

      # The fork stack sits on an upstream tag, stable or nightly. Name it in
      # the release so a nightly base is never ambiguous.
      - id: upstream_base
        name: Resolve upstream base
        run: |
          base="$(git describe --tags --abbrev=0 "$(git merge-base HEAD upstream/main)")"
          echo "tag=$base" >> "$GITHUB_OUTPUT"
          echo "upstream base: $base"

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

  build:
    name: Build Linux x64
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # T3 Connect stays unconfigured unless the fork sets these repository
    # variables; the build does not require them.
    env:
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The Linux icon resize needs `magick` or `convert`. The hosted image
      # ships ImageMagick; apt-get covers an image that drops it.
      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Build desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.AppImage release/*.yml; do
            cp "$file" release-publish/
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # Never a prerelease: electron-updater skips prereleases, and a fork
      # build must update from fork releases.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          body: |
            Upstream base: `${{ needs.preflight.outputs.upstream_base }}`
          generate_release_notes: true
          prerelease: false
          make_latest: true
          # AppImage builds carry no .blockmap; only the bundle and its manifest.
          files: |
            release-assets/*.AppImage
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
