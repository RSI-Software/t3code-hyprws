name: hyprws Agent Context Budget

# Fork copy of upstream's agent-context-budget.yml, which compares against `main`,
# the fork's upstream mirror. This one compares against the PR's base branch, so
# a stack layer is judged against the layer below it. Fails when a PR raises a
# value in agentContextBudget.json; the agent-context-increase label accepts it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: hyprws-agent-context-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUDGET: apps/server/src/provider/agentContextBudget.json
      BASE_REF: ${{ github.base_ref }}
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: apps/server/src/provider/agentContextBudget.json
          sparse-checkout-cone-mode: false

      - name: Compare with base
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "FETCH_HEAD:$BUDGET" 2>/dev/null; then
            echo "$BASE_REF has no agent context budget yet."
            exit 0
          fi
          git show "FETCH_HEAD:$BUDGET" > "$RUNNER_TEMP/base.json"
          grown=$(jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            to_entries[]
            | select($base[0][.key] != null and .value > $base[0][.key])
            | "\(.key): \($base[0][.key]) -> \(.value) (+\(.value - $base[0][.key]))"
          ' "$BUDGET")
          if [ -z "$grown" ]; then
            echo "Agent context is not larger than $BASE_REF."
            exit 0
          fi
          printf 'Agent context grew compared to %s:\n%s\n' "$BASE_REF" "$grown"
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the agent-context-increase label."
            exit 0
          fi
          echo "::error file=$BUDGET::Agent context grew compared to $BASE_REF. Cut the added text, or ask a maintainer to add the agent-context-increase label."
          exit 1
